<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Netlify static form definitions</title></head>
<body>
  <!-- Static form blueprint for the React /learn page. Kept separate from landing content. -->
  <form name="mentoring-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="mentoring-inquiry" />
    <input name="bot-field" />
    <input name="name" />
    <input type="email" name="email" />
    <input name="level" />
    <textarea name="goal"></textarea>
    <input name="language" />
    <input name="utm_source" />
    <input name="utm_medium" />
    <input name="utm_campaign" />
    <input name="landing_page" />
  </form>
</body>
</html>
