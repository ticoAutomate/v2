<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060e1d" />
    <meta name="description" content="TicoAutomate builds smarter businesses through automation, AI integration, modern web development, and connected digital solutions." />
    <meta property="og:title" content="TicoAutomate — Automation, AI & Web Development" />
    <meta property="og:description" content="Less manual work. More room to grow. Explore automation, AI, web development, and custom digital solutions." />
    <meta property="og:type" content="website" />
    <title>TicoAutomate | Automation, AI & Web Development</title>
  </head>
  <body>
    <!-- Static registration form allows Netlify to detect submissions from the React form. -->
    <form name="consultation" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="service" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
