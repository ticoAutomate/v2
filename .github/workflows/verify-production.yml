name: Temporary verify production TicoAutomate website
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public domain and required routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ticoautomate.com"
          LAST=""
          for attempt in $(seq 1 20); do
            STATUS="$(curl -L -sS --max-time 15 -w '%{http_code}' -o /tmp/tico-home.html -H 'Cache-Control: no-cache' "$BASE/?launch-check=20261122" || echo 000)"
            TITLE="$(grep -o '<title>[^<]*</title>' /tmp/tico-home.html | head -1 || true)"
            LAST="$TITLE"
            echo "Attempt $attempt: status=$STATUS title=$TITLE"
            if [[ "$STATUS" == 200 && "$TITLE" == *"TicoAutomate | Automation"* ]]; then
              break
            fi
            sleep 6
          done
          if [[ "$LAST" != *"TicoAutomate | Automation"* ]]; then
            echo "::error::Public domain did not serve the new site"
            exit 1
          fi
          echo "PRODUCTION HOME: confirmed new design"
          curl -fsSL --max-time 20 "$BASE/learn?lang=es" -o /tmp/tico-learn.html
          if ! grep -q 'TicoAutomate' /tmp/tico-learn.html; then
            echo "::error::Production Learn direct URL did not serve the app"
            exit 1
          fi
          echo "PRODUCTION LEARN: direct URL serves app"
          curl -fsSL --max-time 20 "$BASE/__forms.html" -o /tmp/tico-forms.html
          if ! grep -q 'mentoring-inquiry' /tmp/tico-forms.html || ! grep -q 'consultation' /tmp/tico-forms.html; then
            echo "::error::Missing deployed form blueprint"
            exit 1
          fi
          echo "PRODUCTION FORMS: both names registered in static HTML"
          URL="$(curl -Ls -o /dev/null --max-time 20 -w '%{url_effective}' "$BASE/login")"
          echo "LEGACY LOGIN FINAL URL: $URL"
          if [[ "$URL" != *"/learn"* ]]; then
            echo "::error::Retired login did not redirect to /learn"
            exit 1
          fi
          echo "PASS: New TicoAutomate public site and Learn accessible."
