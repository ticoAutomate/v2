name: Temporary Netlify preview form smoke test
on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

jobs:
  form-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET landing and inspect detected form HTML
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-1--ticoautomate.netlify.app"
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 15 "$BASE/__forms.html" -o /tmp/netlify-forms.html; then
              break
            fi
            sleep 5
          done
          curl -fsSL --max-time 20 "$BASE/" -o /tmp/netlify-home.html
          curl -fsSL --max-time 20 "$BASE/learn?lang=es" -o /tmp/netlify-learn.html
          echo "Learn direct URL: HTTP GET successful"
          if grep -q 'name="mentoring-inquiry"' /tmp/netlify-forms.html; then
            echo "Mentoring form static skeleton: found"
          else
            echo "::error::Missing mentoring form skeleton"
            exit 1
          fi
          if grep -q 'name="consultation"' /tmp/netlify-home.html; then
            echo "Consultation form static skeleton: found"
          else
            echo "::error::Missing consultation form skeleton"
            exit 1
          fi
          if grep -q 'data-netlify="true"' /tmp/netlify-forms.html; then
            echo "::warning::Raw form detection attribute remains in deployed HTML; verify Netlify Forms detection is enabled"
          else
            echo "Mentoring form static HTML was transformed by deploy pipeline"
          fi
      - name: POST two clearly marked TEST submissions
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://deploy-preview-1--ticoautomate.netlify.app"
          echo "Submitting a harmless test inquiry for business services"
          SERVICE_CODE=$(curl --max-time 30 -sS -o /tmp/service-post.txt -w "%{http_code}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -X POST "$BASE/" \
            --data-urlencode "form-name=consultation" \
            --data-urlencode "name=TEST FORM - IGNORE" \
            --data-urlencode "email=ticoautomate-form-test@example.com" \
            --data-urlencode "service=other" \
            --data-urlencode "message=TEST SUBMISSION from temporary GitHub Actions preview smoke test. This is not a real prospect.")
          echo "Consultation HTTP status: $SERVICE_CODE"
          if [[ ! "$SERVICE_CODE" =~ ^2[0-9][0-9]$ ]]; then
            head -c 500 /tmp/service-post.txt
            exit 1
          fi
          echo "Submitting a harmless test inquiry for mentoring"
          LEARN_CODE=$(curl --max-time 30 -sS -o /tmp/learn-post.txt -w "%{http_code}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -X POST "$BASE/__forms.html" \
            --data-urlencode "form-name=mentoring-inquiry" \
            --data-urlencode "name=TEST MENTORING - IGNORE" \
            --data-urlencode "email=ticoautomate-form-test@example.com" \
            --data-urlencode "interest=ai" \
            --data-urlencode "level=beginner" \
            --data-urlencode "goal=TEST SUBMISSION from temporary GitHub Actions preview smoke test. This is not a real prospect." \
            --data-urlencode "language=es" \
            --data-urlencode "utm_source=test" \
            --data-urlencode "utm_medium=github-actions" \
            --data-urlencode "utm_campaign=smoke-test" \
            --data-urlencode "landing_page=/learn")
          echo "Mentoring HTTP status: $LEARN_CODE"
          if [[ ! "$LEARN_CODE" =~ ^2[0-9][0-9]$ ]]; then
            head -c 500 /tmp/learn-post.txt
            exit 1
          fi
          echo "Both HTTP submissions accepted. Confirm receipt under Netlify > Forms; 2xx alone does NOT prove stored submissions or email notifications."
